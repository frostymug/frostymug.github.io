<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P3 · Trips Nav Tab — Frost Rocks Multi-Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="phone">
  <div class="screen" id="screen"></div>
  <div class="nav">
    <button class="slot" id="n-note" onclick="go('note')"><div class="ic">📓</div><span class="lbl">Notebook</span></button>
    <button class="slot" id="n-map" onclick="go('map')"><div class="ic">🗺️</div><span class="lbl">Map</span></button>
    <button class="capslot" onclick="capHint()"><div class="ring">+</div><span class="lbl">Capture</span></button>
    <button class="slot" id="n-review" onclick="go('review')"><div class="ic">🕒</div><span class="lbl">Review</span></button>
    <button class="slot" id="n-trips" onclick="go('trips')"><div class="ic">📚</div><span class="lbl">Trips</span></button>
  </div>
</div>
<p class="cap" style="max-width:390px;text-align:center">P3 — A dedicated <b>Trips</b> tab fills the reserved 5th slot. The shelf becomes a top-level place of its own.</p>

<script src="data.js"></script>
<script>
function noteScreen(){
  const t=window.trip(window.CURRENT_TRIP_ID);
  return `<div class="pad">
    <div class="over">The Field Notebook</div><div class="h1">${t.title}</div>
    <div class="cap" style="margin-top:4px">${t.place} · ${t.count} encounters · 3 today</div>
    <div style="height:14px"></div>
    <div class="anchor">FR-MT-P3-01 current-trip notebook</div>
    ${window.tripTimeline(window.CURRENT_TRIP_ID)}</div>`;
}
function mapScreen(){
  const t=window.trip(window.CURRENT_TRIP_ID);
  return `<div class="pad"><div class="over">Field map</div><div class="h2">${t.title}</div>
    <div style="height:12px"></div><div class="anchor">FR-MT-P3-02 map = current trip</div>
    <div class="map locked"><div class="mlabel">${t.place}</div>${window.mapPins(window.CURRENT_TRIP_ID)}</div></div>`;
}
function reviewScreen(){
  return `<div class="pad"><div class="over">Review</div><div class="h1">Review Door County</div>
    <p class="cap" style="margin:6px 0 14px">Review is scoped to the current trip here — roaming across trips lives in the Trips tab instead.</p>
    <div class="anchor">FR-MT-P3-03 review = current trip; roam lives in Trips</div>
    <div class="card"><div class="h3">Review Today’s Encounters</div><div class="cap ink2" style="margin-top:4px">3 waiting · evening debrief (D3)</div></div>
    <div class="card" style="opacity:.55"><div class="h3">Review the Trip So Far</div><div class="cap" style="margin-top:4px">stubbed — T3 door</div></div></div>`;
}
function tripsScreen(){
  const groups={active:[],upcoming:[],previous:[]};
  window.TRIPS.forEach(t=>groups[t.state].push(t));
  const sec=(title,arr)=> arr.length? `<div class="over" style="margin:18px 0 8px">${title}</div>`+arr.map(tripCard).join('') : '';
  return `<div class="pad"><div class="over">Your travels</div><div class="h1">Trips</div>
    <p class="cap" style="margin:6px 0 4px">A shelf of everywhere you’ve rocked. Tap a past trip to revisit; tap an upcoming one to prep.</p>
    <div class="anchor">FR-MT-P3-04 trips as a top-level place</div>
    ${sec('Active',groups.active)}${sec('Upcoming',groups.upcoming)}${sec('Previous',groups.previous)}</div>`;
}
function tripCard(t){
  return `<div class="cover ${t.state==='active'?'active':''}" onclick="tapTrip('${t.id}')">
    <div class="art ${t.art}"><div class="place">${t.glyph}</div></div>
    <div class="info"><div><div class="h3">${t.title}</div><div class="cap">${t.place} · ${t.dates}</div></div>
    <div style="text-align:right">${window.stateChip(t.state)}<div class="cap mono" style="margin-top:4px">${t.count||'—'} enc</div></div></div></div>`;
}
function tapTrip(id){
  const t=window.trip(id);
  if(t.state==='active'){ window.CURRENT_TRIP_ID=id; go('note'); return; }
  alert(`${t.title} (${t.state}).\n\n`+(t.state==='previous'?'Would open T3 — revisit & consolidate this past trip.':'Would open T1 — plan & prep this upcoming trip.')+'\n(T1/T3 not built yet.)');
}
let view='note';
function go(v){ view=v; render(); }
function render(){
  document.getElementById('screen').innerHTML =
    view==='note'?noteScreen():view==='map'?mapScreen():view==='review'?reviewScreen():tripsScreen();
  ['note','map','review','trips'].forEach(v=>document.getElementById('n-'+v).classList.toggle('on',v===view));
}
function capHint(){ alert('Capture writes to the CURRENT trip only (Door County).\n\nIn P3 the Trips tab is a peer of Capture in the nav — watch that this doesn’t make trip-switching feel like an everyday gesture (you said it isn’t).'); }
render();
</script>
</body></html>
